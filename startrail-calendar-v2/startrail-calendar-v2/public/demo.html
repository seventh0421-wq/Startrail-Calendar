/* 副本活動：多位置志願與主揪排位 */
[hidden]{display:none!important}
.role-preferences{margin-top:18px;padding:15px;border-radius:17px;background:#111c35;border:1px solid #4a5b80}
.role-preferences h3,.host-assign-panel h3{font-size:15px;margin:0 0 5px;color:#f5dfb6}
.role-preferences p,.host-assign-panel p{font-size:12px;color:#b1c0dd;margin:0 0 12px}
.role-options{display:grid;gap:9px}
.role-card{border:1px solid #4b5977;border-radius:13px;padding:11px 12px;background:#1c2948}
.role-card.selected{border-color:#bba9e0;background:#283154}
.role-card-head{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;cursor:pointer}
.role-card-head input{width:18px;height:18px;accent-color:#e0c28e}
.role-card .field{margin-top:9px}
.role-card .field input{min-height:39px;background:#111930}
.role-note{font-size:11px;color:#acbbd5;margin-top:6px}
.roster-grid{display:grid;gap:9px;margin-top:12px}
.roster-person{background:#263452;border:1px solid #4a5a7b;border-radius:12px;padding:10px 12px}
.roster-person.me{border-color:#dfc28b}
.roster-name{font-size:13px;color:#eff1f5;font-weight:750}
.roster-pref{font-size:11px;color:#b8c8e2;margin-top:5px;line-height:1.55;overflow-wrap:anywhere}
.roster-assign{font-size:11px;color:#f0d5a3;margin-top:5px}
.host-assign-panel{margin-top:18px;border:1px solid #7b6f95;background:#302b4b5e;border-radius:16px;padding:14px}
.host-person{border-top:1px solid #4b5272;padding:11px 0 4px}
.host-person:first-of-type{border-top:0}
.assignment-editor{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:7px}
.assignment-editor select{min-width:0;width:100%;border:1px solid #65708c;background:#141e37;color:#f0f3fa;border-radius:10px;padding:9px 8px;min-height:41px;font-size:12px}
.assignment-editor .btn{grid-column:1/-1;justify-self:stretch}
.assignment-editor label{font-size:11px;color:#c2cce2;display:block;margin:0 0 4px}
.job-hint{font-size:11px;color:#bbc6db;margin:4px 0 0}
.job-hint strong{color:#f2dcaf}
@media(min-width:680px){.role-options{grid-template-columns:repeat(3,minmax(0,1fr))}.assignment-editor{grid-template-columns:1fr 1fr auto}.assignment-editor .btn{grid-column:auto;align-self:end}}

/* V1.2 主揪隊伍配置總覽：僅計算已正式排位的人員 */
.party-summary{margin-top:18px;border:1px solid #6d7394;background:linear-gradient(145deg,#222b4c,#191f39);border-radius:18px;padding:15px}
.party-summary-header{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.party-summary-header h3{font-family:Georgia,"Noto Serif TC",serif;font-size:16px;color:#f2dfbc;margin:0 0 5px}
.party-summary-header p{font-size:11px;color:#b4c4df;margin:0 0 14px;line-height:1.6}
.party-summary-kpi{border:1px solid #6b7595;background:#323956;border-radius:50px;font-size:11px;color:#eadbbd;padding:5px 10px;white-space:nowrap;font-weight:700}
.party-progress-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-bottom:15px}
.party-progress-card{border:1px solid #4b5979;border-radius:12px;padding:10px 7px;background:#1a2642;min-width:0}
.party-progress-card .pc-head{font-size:11px;white-space:nowrap;color:#cad7e9}
.party-progress-card .pc-number{font-size:21px;font-weight:800;letter-spacing:.01em;line-height:1.4;color:#f2e3c9}
.party-progress-card .pc-number span{font-size:12px;color:#9fb0d1;font-weight:550}
.party-meter{height:5px;border-radius:12px;background:#405070;overflow:hidden;margin-top:7px}
.party-meter>span{display:block;height:100%;background:#e7b3bd;border-radius:12px}
.party-progress-card.healer .party-meter>span{background:#8fceb2}
.party-progress-card.dps .party-meter>span{background:#b4a2e6}
.party-slot-group{border-top:1px solid #43506d;padding:12px 0 0;margin-top:12px}
.party-slot-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:800;margin-bottom:9px}
.party-slot-head span:last-child{font-size:11px;font-weight:500;color:#aebcda}
.party-slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.party-slot{min-width:0;border:1px solid #586789;background:#303e5d;border-radius:10px;padding:8px 10px;font-size:11px}
.party-slot .slot-name{font-weight:750;color:#f5efe4;overflow-wrap:anywhere}
.party-slot .slot-job{color:#c0cfeb;margin-top:2px;overflow-wrap:anywhere}
.party-slot.empty{border-style:dashed;background:#17223c;color:#8c9bb8;display:flex;align-items:center;justify-content:center;min-height:50px;text-align:center}
.party-slot.overflow{border-color:#d58488;background:#543045}
.party-unassigned{border:1px solid #5a6080;border-radius:12px;background:#31324b7a;padding:10px 12px;margin-top:12px;font-size:11px;color:#d4d9ed;line-height:1.7}
.party-unassigned strong{color:#f1dfba}
.party-no-template{font-size:11px;color:#b6c4df;margin-top:10px}
@media(min-width:680px){.party-summary{padding:18px}.party-slots{grid-template-columns:repeat(2,minmax(0,1fr))}.party-progress-card{padding:12px}}
</style>
</head>
<body>
<div class="app"><aside class="sidebar"><div class="brand"><div class="brand-mark">✧</div><div><div class="brand-name">星旅日誌</div><div class="brand-sub">EORZEA ADVENTURE LOG</div></div></div><nav class="side-links" id="sideNav"></nav><div class="side-bottom">✦ 星空冒險風 · V1.2<br>本頁為可互動的瀏覽器原型<br>尚未連線至 Firebase / Discord</div></aside><div><header class="mobile-top"><div class="brand"><div class="brand-mark">✧</div><div><div class="brand-name">星旅日誌</div><div class="brand-sub">一起出發吧，冒險者</div></div></div><div class="demo">✦ DEMO</div></header><main class="main" id="appMain"></main></div><nav class="bottom-nav" id="bottomNav"></nav></div><div id="overlay"></div><div id="toast" aria-live="polite"></div>
<script>
(()=>{'use strict';
const KEY='eorzea-adventure-demo-v1';
const TYPES={battle:{name:'戰鬥',emoji:'⚔️',css:'battle'},explore:{name:'探索',emoji:'🗺️',css:'explore'},photo:{name:'攝影',emoji:'📸',css:'photo'},rp:{name:'RP',emoji:'🎭',css:'rp'},other:{name:'其他',emoji:'✨',css:'other'}};
const NAV=[['home','⌂','首頁'],['calendar','▦','行事曆'],['create','⊕','開團'],['mine','♡','我的活動'],['profile','♙','個人']];
const pad=n=>String(n).padStart(2,'0');
const iso=(date)=>`${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`;
const addDays=n=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return iso(d)};
const dateOf=s=>{let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12,0,0)};
const dateFmt=s=>new Intl.DateTimeFormat('zh-TW',{month:'long',day:'numeric',weekday:'short'}).format(dateOf(s));
const weekday=s=>['日','一','二','三','四','五','六'][dateOf(s).getDay()];
const escapeHtml=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const user=()=>state.profile.name||'星旅者';
const seed=()=>({profile:{name:'星旅者',avatar:'🌙',isAdmin:true},events:[
{id:'demo1',title:'週末零式練習團',category:'battle',date:addDays(4),time:'21:00',end:'23:00',location:'Elemental 資料中心',host:'小明',hostId:'m1',description:'歡迎一起練習！請先熟悉基本機制。輕鬆打、互相鼓勵。',cap:8,roleEnabled:true,waitlistEnabled:true,participants:[{id:'m1',name:'小明',rolePreferences:{tank:'騎士、戰士'},assignment:{role:'tank',job:'騎士'}},{id:'m2',name:'小花',rolePreferences:{healer:'白魔導士、學者',dps:'召喚師'},assignment:{role:'healer',job:'白魔導士'}},{id:'m3',name:'阿月',rolePreferences:{dps:'武士、舞者'},assignment:{role:'dps',job:'武士'}},{id:'m4',name:'小夜',rolePreferences:{dps:'舞者、召喚師',healer:'賢者'},assignment:{role:'dps',job:'舞者'}}],waitlist:[],status:'active'},
{id:'demo2',title:'晚上的藏寶圖散步',category:'explore',date:addDays(7),time:'20:30',end:'22:00',location:'遊戲內集合：待公告',host:'星旅者',hostId:'me',description:'沒有壓力的晚間挖寶！新手也歡迎參加。',cap:8,roleEnabled:false,waitlistEnabled:true,participants:[{id:'me',name:'星旅者'},{id:'m2',name:'小花'}],waitlist:[],status:'active'},
{id:'demo3',title:'魔女集會攝影會',category:'photo',date:addDays(12),time:'20:00',end:'22:00',location:'攝影棚集合，位置另行公布',host:'小花',hostId:'m2',description:'帶上你的搭檔與喜歡的幻化，一起留下魔女們的夜晚。',cap:0,roleEnabled:false,waitlistEnabled:false,participants:[{id:'m2',name:'小花'},{id:'m3',name:'阿月'},{id:'m1',name:'小明'}],waitlist:[],status:'active'},
{id:'demo4',title:'週末咖啡館 RP 夜',category:'rp',date:addDays(18),time:'21:30',end:'23:00',location:'店內集合',host:'小夜',hostId:'m4',description:'聊天、角色互動、拍照都可以，輕鬆來玩。',cap:6,roleEnabled:false,waitlistEnabled:true,participants:[{id:'m4',name:'小夜'},{id:'m1',name:'小明'},{id:'m2',name:'小花'},{id:'m3',name:'阿月'},{id:'m5',name:'咩咩'},{id:'m6',name:'小雨'}],waitlist:[{id:'m7',name:'木木'}],status:'active'}]});
let state;try{state=JSON.parse(localStorage.getItem(KEY))||seed();if(!state||!Array.isArray(state.events)||!state.profile)state=seed()}catch{state=seed()}
let page='home',month=new Date().getMonth(),year=new Date().getFullYear(),picked=iso(new Date()),calMode='month',category='all',myTab='joined',dialog=null,editId=null,editingPreferences=false,chosenAvatar=state.profile.avatar;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
function toast(msg){const el=document.getElementById('toast');el.innerHTML=`<div class="toast">${escapeHtml(msg)}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.innerHTML='',3100)}
function sorted(list){return [...list].sort((a,b)=>`${a.date}T${a.time}`.localeCompare(`${b.date}T${b.time}`))}
function upcoming(){return sorted(state.events.filter(e=>e.status==='active'&&`${e.date}T${e.end||e.time}`>=`${iso(new Date())}T00:00`))}
function joined(e){return e.participants.some(p=>p.id==='me')}
function waited(e){return e.waitlist.some(p=>p.id==='me')}
function isFull(e){return e.cap>0&&e.participants.length>=e.cap}
function registered(e){return joined(e)||waited(e)}
function head(title,subtitle,right=''){return `<header class="topbar"><div><div class="eyebrow">✦ EORZEA ADVENTURE LOG</div><h1>${title}</h1><p class="subtitle">${subtitle}</p></div>${right}</header>`}
function typePill(e){let t=TYPES[e.category]||TYPES.other;return `<span class="pill ${t.css}">${t.emoji} ${t.name}</span>`}
function navHtml(side){return NAV.map(([id,ico,label])=>`<button data-nav="${id}" class="${side?'side-btn':'nav-btn'} ${page===id?'active':''}"><span class="nav-ico" aria-hidden="true">${ico}</span><span>${label}</span></button>`).join('')+(side?`<button data-nav="admin" class="side-btn ${page==='admin'?'active':''}"><span class="nav-ico">⚙</span><span>管理設定</span></button>`:'')}
function nav(){document.getElementById('sideNav').innerHTML=navHtml(true);document.getElementById('bottomNav').innerHTML=navHtml(false)}
function count(){return upcoming().filter(joined).length}
function eventCard(e){let date=dateOf(e.date),n=e.participants.length,me=joined(e),w=waited(e),cap=e.cap?`${n} / ${e.cap}`:`${n} 人`,pct=e.cap?Math.min(100,n/e.cap*100):100;
return `<article class="card event-card"><div class="date-block"><div class="day">${date.getDate()}</div><div class="mon">${date.getMonth()+1}月</div><div class="mon">週${weekday(e.date)}</div></div><div class="event-body"><div class="row between gap6">${typePill(e)}${me?'<span class="pill joined">✓ 已 +1</span>':w?'<span class="pill wait">候補中</span>':e.status==='cancelled'?'<span class="pill cancelled">已取消</span>':''}</div><div class="event-title">${escapeHtml(e.title)}</div><div class="meta"><span>◷ ${escapeHtml(e.time)}</span><span>♙ ${escapeHtml(e.host)}</span></div><div class="event-bottom"><div style="min-width:80px;flex:1"><div class="limit-line"><span>♧ ${cap}</span>${e.cap?`<div class="progress"><div style="width:${pct}%"></div></div>`:''}</div></div><button class="btn small soft" data-detail="${e.id}">查看詳情 ›</button></div></div></article>`}
function empty(title,body){return `<div class="card empty-state"><div class="em">✦</div><strong>${title}</strong><div>${body}</div></div>`}
function home(){let active=upcoming(),mine=active.filter(e=>joined(e));let next=active[0];
return `${head('冒險總覽','今天，也來看看朋友們準備去哪裡冒險。',`<button class="btn primary" data-nav="create">＋ 發起冒險</button>`)}
<section class="hero"><div class="hero-note">✧ THE NEXT ADVENTURE AWAITS</div><h2>星光之下，<br>與夥伴們再次相遇。</h2><p>把每一場約定寫進日誌。開團、報名、出發，一起收藏屬於朋友們的冒險時光。</p><div class="row wrap"><button class="btn primary" data-nav="calendar">查看共用行事曆　›</button><button class="btn soft" data-nav="create">✧ 我要開團</button></div></section>
<div class="stats"><div class="stat"><strong>${active.length}</strong><span>接下來的活動</span></div><div class="stat"><strong>${mine.length}</strong><span>我已 +1</span></div><div class="stat"><strong>${active.filter(e=>e.cap>0&&!isFull(e)).length}</strong><span>還有名額的團</span></div></div>
<section class="section"><div class="section-head"><div><h2 class="h2">✦ 即將展開的冒險</h2><p>朋友們最近發起的活動</p></div><button class="linkish" data-nav="calendar">全部活動 ›</button></div><div class="event-grid">${active.length?active.slice(0,6).map(eventCard).join(''):empty('還沒有活動','點選「發起冒險」建立第一場活動吧！')}</div></section>
<section class="section"><div class="section-head"><div><h2 class="h2">♡ 我準備參加</h2><p>下次出發前，不用再翻聊天紀錄</p></div><button class="linkish" data-nav="mine">我的活動 ›</button></div><div class="event-grid">${mine.length?mine.slice(0,3).map(eventCard).join(''):empty('還沒有報名的活動','去看看大家最近開了什麼團吧！')}</div></section>`}
function calendar(){let days=new Date(year,month+1,0).getDate(),offset=new Date(year,month,1).getDay();let monthKey=`${year}-${pad(month+1)}`,eligible=sorted(state.events.filter(e=>e.date.startsWith(monthKey)&&e.status==='active'&&(category==='all'||e.category===category)));let shown=eligible.filter(e=>calMode==='list'||e.date===picked);let todays=iso(new Date());let rows=[];for(let i=0;i<offset;i++)rows.push('<div class="cal-cell empty"></div>');for(let d=1;d<=days;d++){let date=`${monthKey}-${pad(d)}`,eventlist=eligible.filter(e=>e.date===date);rows.push(`<button class="cal-cell ${picked===date?'selected':''} ${todays===date?'today':''}" data-pick="${date}" aria-label="${date}，${eventlist.length} 個活動"><span class="cal-date">${d}</span><span class="cal-dots">${eventlist.slice(0,4).map(e=>`<span class="dot ${e.category}"></span>`).join('')}</span>${eventlist.slice(0,2).map(e=>`<span class="cal-event-label">${escapeHtml(e.title)}</span>`).join('')}</button>`)}
return `${head('共用行事曆','所有活動，一眼掌握。點選日期查看當天的冒險。',`<button class="btn primary" data-nav="create">＋ 新活動</button>`)}
<div class="row between wrap" style="margin-bottom:13px"><div class="row"><button class="btn small ${calMode==='month'?'primary':'soft'}" data-calmode="month">月曆</button><button class="btn small ${calMode==='list'?'primary':'soft'}" data-calmode="list">清單</button></div><div class="cal-controls"><button class="icon-btn" data-month="prev" aria-label="上個月">‹</button><strong>${year} 年 ${month+1} 月</strong><button class="icon-btn" data-month="next" aria-label="下個月">›</button><button class="btn small soft" data-month="today">今天</button></div></div>
<div class="scroll-row" style="margin-bottom:14px">${[['all','全部活動','✦'],...Object.keys(TYPES).map(k=>[k,TYPES[k].name,TYPES[k].emoji])].map(([id,name,ico])=>`<button class="chip ${category===id?'on':''}" data-category="${id}">${ico} ${name}</button>`).join('')}</div>
${calMode==='month'?`<div class="calendar-layout"><div class="card pad"><div class="cal-grid">${['日','一','二','三','四','五','六'].map(s=>`<div class="weekday">${s}</div>`).join('')}${rows.join('')}</div><div class="row wrap gap8" style="margin-top:15px">${Object.values(TYPES).map(t=>`<span class="small muted"><span style="color:${t.css==='battle'?'#e4a9bf':t.css==='explore'?'#8bd0c1':t.css==='photo'?'#95a9ed':t.css==='rp'?'#bf9fe2':'#eccb9a'}">●</span> ${t.name}</span>`).join('')}</div></div><div class="card cal-side"><div class="eyebrow">SELECTED DATE</div><h3 class="panel-heading" style="margin:5px 0">${dateFmt(picked)}</h3><p class="small muted">${shown.length} 場冒險</p><div class="divider"></div>${shown.length?shown.map(e=>`<button class="cal-event" data-detail="${e.id}"><span class="time-label">${escapeHtml(e.time)}</span><span style="flex:1"><strong>${escapeHtml(e.title)}</strong><br><span class="tiny muted">${TYPES[e.category].name} · ${e.participants.length}${e.cap?'/'+e.cap:''} 人</span></span><span>›</span></button>`).join(''):empty('當天沒有活動','選擇其他日期，或發起新活動！')}</div></div>`:`<div class="list-view">${eligible.length?eligible.map(eventCard).join(''):empty('這個月還沒有活動','試試切換月份或建立新的冒險。')}</div>`}`}
function catOptions(selected){return Object.entries(TYPES).map(([key,t])=>`<input class="category-radio" type="radio" id="category-${key}" name="category" value="${key}" ${selected===key?'checked':''}><label class="category-label" for="category-${key}">${t.emoji} ${t.name}</label>`).join('')}
function create(){let e=editId?state.events.find(x=>x.id===editId):null,defaultDay=e?.date||iso(new Date());return `${head(e?'編輯冒險':'發起新的冒險',e?'更新活動資訊，讓夥伴們知道最新安排。':'只要幾個步驟，就能邀請朋友一起出發。')}<div class="form-wrap"><form id="eventForm"><section class="card form-section"><h3>01 · 這次要去哪裡冒險？</h3><div class="fields"><div class="field"><label for="title">活動名稱 <span class="gold">＊</span></label><input name="title" id="title" required maxlength="55" placeholder="例如：今晚一起挖寶！" value="${escapeHtml(e?.title||'')}"></div><div class="field"><label>活動分類 <span class="gold">＊</span></label><div class="radio-row">${catOptions(e?.category||'explore')}</div></div><div class="field"><label for="description">活動說明</label><textarea name="description" id="description" maxlength="1500" placeholder="集合方式、希望準備的東西、注意事項……">${escapeHtml(e?.description||'')}</textarea></div></div></section>
<section class="card form-section"><h3>02 · 約定時間與地點</h3><div class="fields two"><div class="field"><label for="date">日期 <span class="gold">＊</span></label><input type="date" name="date" id="date" required value="${defaultDay}"></div><div class="field"><label for="start">開始時間 <span class="gold">＊</span></label><input type="time" id="start" name="time" required value="${e?.time||'21:00'}"></div><div class="field"><label for="end">結束時間</label><input type="time" id="end" name="end" value="${e?.end||'23:00'}"></div><div class="field"><label for="location">集合地點</label><input id="location" name="location" maxlength="100" value="${escapeHtml(e?.location||'')}" placeholder="伺服器、地圖或 Discord 頻道"></div></div><p class="small muted">網站以台灣時間（UTC+8）顯示；正式版會將時間標準化儲存。</p></section>
<section class="card form-section"><h3>03 · 報名設定</h3><div class="fields"><div class="field"><label for="cap">參加人數上限</label><select id="cap" name="cap">${[[0,'不限人數'],[4,'4 人'],[8,'8 人'],[24,'24 人'],[6,'6 人']].map(([n,l])=>`<option value="${n}" ${Number(e?.cap??8)===n?'selected':''}>${l}</option>`).join('')}</select><span class="hint">主揪預設算進人數；不限人數時不顯示進度條。</span></div><label class="check-row"><input type="checkbox" name="waitlistEnabled" ${e?.waitlistEnabled!==false?'checked':''}>額滿後開放候補</label><label class="check-row"><input type="checkbox" name="roleEnabled" ${e?.roleEnabled?'checked':''}>副本活動：開啟坦／補／輸出的多選志願與職業自填（由主揪排位）</label><span class="hint">副本團建議啟用。8 人團會顯示坦克 2／2、補師 2／2、輸出 4／4；玩家可複選志願，但只有主揪正式排位才算進配置。</span></div></section><div class="notice" style="margin-bottom:14px">✧ 原型中發布的活動只會儲存在這個瀏覽器，不會自動分享給真正的好友。正式版會接上會員與 Firebase。</div><div class="row wrap"><button type="submit" class="btn primary" style="flex:1">${e?'儲存變更':'✦ 發布活動'}</button><button type="button" class="btn soft" data-nav="calendar">返回月曆</button></div></form></div>`}
function mine(){let chosen=myTab==='joined'?state.events.filter(joined):myTab==='hosting'?state.events.filter(e=>e.hostId==='me'):state.events.filter(waited);return `${head('我的冒險','你發起與參加過的每一場約定，都收藏在這裡。')}<div class="tabs">${[['joined','我已 +1'],['hosting','我開的團'],['wait','候補中的團']].map(([key,label])=>`<button class="chip ${myTab===key?'on':''}" data-mytab="${key}">${label} (${key==='joined'?state.events.filter(joined).length:key==='hosting'?state.events.filter(e=>e.hostId==='me').length:state.events.filter(waited).length})</button>`).join('')}</div><div class="event-grid" style="margin-top:15px">${chosen.length?sorted(chosen).map(eventCard).join(''):empty('這裡還沒有活動',myTab==='hosting'?'你也可以當大家的主揪！':'到行事曆看看有沒有想參加的活動吧。')}</div>`}
function profile(){return `${head('冒險者資料','設定朋友們在報名名單中看到的名字與頭像。')}<div class="form-wrap"><div class="card pad"><div class="profile-head"><div class="avatar">${escapeHtml(state.profile.avatar)}</div><div><div class="eyebrow">ADVENTURER PROFILE</div><h2 style="margin:5px 0">${escapeHtml(user())}</h2><p class="small muted" style="margin:0">示範帳號 · 管理員視角</p></div></div><div class="divider"></div><form id="profileForm"><div class="fields"><div class="field"><label for="profileName">FF14 角色暱稱</label><input id="profileName" name="name" maxlength="25" required value="${escapeHtml(state.profile.name)}"></div><div class="field"><label>選一個代表你的頭像</label><div class="avatar-pick">${['🌙','✨','🦊','⭐','🌸'].map(a=>`<button type="button" data-avatar="${a}" class="${chosenAvatar===a?'picked':''}" aria-label="${a}">${a}</button>`).join('')}</div></div><div class="notice">正式版會提供 Google 登入與好友邀請制；這裡只是示範會員外觀，並未真正驗證身分。</div><button type="submit" class="btn primary">儲存個人資料</button></div></form></div><section class="section card pad"><h2 class="h2">⚙ 網站設定</h2><p class="small muted">群組成員與活動權限會在管理頁集中設定。</p><button class="btn soft" data-nav="admin">前往管理頁 ›</button></section><section class="section card pad"><h2 class="h2">↺ 原型資料</h2><p class="small muted">想重新體驗所有示範流程，可還原初始活動與報名狀態。</p><button class="btn danger small" data-action="reset">重設示範資料</button></section></div>`}
function admin(){let active=state.events.filter(e=>e.status==='active');let hosts=new Set(state.events.map(e=>e.host)).size;return `${head('群組管理','僅管理員可進入。此處為權限與成員設計示意。')}<div class="admin-grid"><div class="card pad"><div class="eyebrow">ACTIVE EVENTS</div><div style="font-size:30px;color:var(--gold);font-weight:750">${active.length}</div><div class="small muted">開放中的活動</div></div><div class="card pad"><div class="eyebrow">EVENT HOSTS</div><div style="font-size:30px;color:var(--gold);font-weight:750">${hosts}</div><div class="small muted">示範主揪數</div></div></div><section class="section card pad"><h2 class="h2">成員與角色權限</h2><p class="small muted">建議正式版使用：未加入者／一般好友／活動主揪／群組管理員。登入需先經過邀請核准，才能讀取私人活動。</p><div class="divider"></div><div class="row between"><span>🌙 ${escapeHtml(user())}</span><span class="pill joined">管理員（示範）</span></div></section><section class="section card pad"><h2 class="h2">後續整合</h2><div class="row wrap" style="margin-top:12px"><span class="pill other">Google 登入</span><span class="pill other">Firebase 共用資料庫</span><span class="pill other">Discord 通知機器人</span></div><p class="small muted">這些是正式開發階段的規劃項目，不是目前原型已啟用的功能。</p></section>`}
function render(){nav();const map={home,calendar,create,mine,profile,admin};document.getElementById('appMain').innerHTML=(map[page]||home)()+`<footer class="footer">✧ 星旅日誌 · 僅供介面試用的 V1.2 原型 · 不代表實際朋友報名資料</footer>`;if(dialog)showDialog()}
const ROLE_TYPES={tank:{name:'坦克',icon:'🛡️',placeholder:'例如：騎士、戰士、暗黑騎士'},healer:{name:'補師',icon:'💚',placeholder:'例如：白魔導士、學者、占星術士'},dps:{name:'輸出',icon:'⚔️',placeholder:'例如：武士、舞者、召喚師'}};
function cleanPrefs(p){
  if(p&&p.rolePreferences&&typeof p.rolePreferences==='object'){
    return Object.fromEntries(Object.entries(ROLE_TYPES).filter(([k])=>Object.prototype.hasOwnProperty.call(p.rolePreferences,k)).map(([k])=>[k,String(p.rolePreferences[k]||'')]));
  }
  let old=Object.entries(ROLE_TYPES).find(([,r])=>r.name===p?.role);
  return old?{[old[0]]:''}:{};
}
function roleJobs(text){return [...new Set(String(text||'').split(/[、，,／/;；\n]+/g).map(s=>s.trim()).filter(Boolean))]}
function formatPrefs(p){let prefs=cleanPrefs(p);let parts=Object.entries(prefs).map(([k,txt])=>`${ROLE_TYPES[k].name}${txt?'：'+escapeHtml(txt):'（未填職業）'}`);return parts.length?parts.join(' ／ '):'尚未填寫可打位置'}
function preferenceFields(person){const prev=cleanPrefs(person);return `<section class="role-preferences" id="prefBox"><h3>✦ 我能打哪些位置？</h3><p>可以同時勾選坦克、補師與輸出。每個選中的位置請填寫職業；可以用頓號分隔多個職業。主揪之後才會決定實際分配。</p><div class="role-options">${Object.entries(ROLE_TYPES).map(([k,r])=>{let selected=Object.prototype.hasOwnProperty.call(prev,k);return `<div class="role-card ${selected?'selected':''}" data-role-card="${k}"><label class="role-card-head"><input type="checkbox" data-role-check="${k}" ${selected?'checked':''}><span>${r.icon} ${r.name}</span></label><div class="field" data-role-panel="${k}" ${selected?'':'hidden'}><label for="roleJobs-${k}">能玩的${r.name}職業</label><input id="roleJobs-${k}" data-role-job="${k}" maxlength="150" placeholder="${r.placeholder}" value="${escapeHtml(prev[k]||'')}"><span class="hint">可填多個，例如用「、」分隔</span></div></div>`}).join('')}</div><div class="role-note">提醒：三個位置都勾選，也只會算一個報名名額。</div></section>`}
function getPreferences(){const out={};for(const [k,r] of Object.entries(ROLE_TYPES)){let c=document.querySelector(`[data-role-check="${k}"]`);if(!c?.checked)continue;let value=document.querySelector(`[data-role-job="${k}"]`)?.value.trim()||'';if(!value){toast(`請填寫${r.name}可使用的職業`);document.querySelector(`[data-role-job="${k}"]`)?.focus();return null;}out[k]=value;}if(!Object.keys(out).length){toast('請至少選一個可打位置');return null}return out}
function assignmentJobs(person,role,selected=''){let list=roleJobs(cleanPrefs(person)[role]);return `<option value="">— 尚未安排職業 —</option>${list.map(job=>`<option value="${escapeHtml(job)}" ${selected===job?'selected':''}>${escapeHtml(job)}</option>`).join('')}`}
function hostAssignmentPanel(e){if(!e.roleEnabled||e.hostId!=='me')return '';return `<section class="host-assign-panel"><h3>✦ 主揪排位區</h3><p>只有主揪可以決定每個人的正式位置與職業；參加者的複選只是可打意願，不會自動分配。此區僅在你的主揪視角顯示。</p>${e.participants.map(p=>{let prefs=cleanPrefs(p),assigned=p.assignment||{},role=assigned.role||'';let roles=Object.keys(prefs);return `<div class="host-person"><strong class="small">${escapeHtml(p.name)}${p.id==='me'?'（你）':''}</strong><div class="job-hint">可打：${formatPrefs(p)}</div>${roles.length?`<div class="assignment-editor" data-assign-row="${escapeHtml(p.id)}"><div><label>正式位置</label><select data-assignment-role="${escapeHtml(p.id)}"><option value="">待安排</option>${roles.map(k=>`<option value="${k}" ${role===k?'selected':''}>${ROLE_TYPES[k].name}</option>`).join('')}</select></div><div><label>正式職業</label><select data-assignment-job="${escapeHtml(p.id)}" ${role?'':'disabled'}>${role?assignmentJobs(p,role,assigned.job||''):'<option value="">請先選位置</option>'}</select></div><button class="btn small primary" data-assign="${e.id}" data-player="${escapeHtml(p.id)}">儲存安排</button></div>`:`<div class="job-hint">尚未填寫位置志願，請先請玩家補充。</div>`}</div>`}).join('')}</section>`}
const PARTY_TEMPLATES={4:{tank:1,healer:1,dps:2},8:{tank:2,healer:2,dps:4},24:{tank:3,healer:6,dps:15}};
function partySummary(e){
 if(!e.roleEnabled)return '';
 const plan=PARTY_TEMPLATES[Number(e.cap)]||null;
 const assigned=e.participants.filter(p=>p.assignment?.role&&ROLE_TYPES[p.assignment.role]);
 const unassigned=e.participants.filter(p=>!p.assignment?.role||!ROLE_TYPES[p.assignment.role]);
 const groups=Object.fromEntries(Object.keys(ROLE_TYPES).map(k=>[k,assigned.filter(p=>p.assignment.role===k)]));
 const filled=assigned.length,fullyAssigned=unassigned.length===0;
 const counters=Object.entries(ROLE_TYPES).map(([k,r])=>{
   let goal=plan?.[k],count=groups[k].length,ratio=goal?Math.min(100,count/goal*100):Math.min(100,count/(e.cap||8)*100);
   return `<div class="party-progress-card ${k}" data-party-count="${k}"><div class="pc-head">${r.icon} ${r.name}</div><div class="pc-number">${count}${goal===undefined?'':` <span>/ ${goal}</span>`}</div><div class="party-meter"><span style="width:${ratio}%"></span></div></div>`;
 }).join('');
 const groupRows=Object.entries(ROLE_TYPES).map(([k,r])=>{
    const group=groups[k],slots=group.map(p=>`<div class="party-slot ${plan&&group.length>plan[k]?'overflow':''}"><div class="slot-name">${escapeHtml(p.name)}</div><div class="slot-job">${escapeHtml(p.assignment?.job||'職業待安排')}</div></div>`);
    const open=plan?Math.max(0,plan[k]-group.length):0;
    if(plan){for(let i=0;i<open;i++)slots.push(`<div class="party-slot empty">✧ 待安排</div>`)}
    return `<div class="party-slot-group"><div class="party-slot-head"><span>${r.icon} ${r.name}</span><span>${plan?`正式排位 ${group.length} / ${plan[k]}`:`已安排 ${group.length} 人`}</span></div><div class="party-slots">${slots.join('')||'<div class="party-slot empty">目前尚未安排</div>'}</div></div>`;
 }).join('');
 const isComplete=plan&&fullyAssigned&&Object.entries(plan).every(([k,n])=>groups[k].length===n);
 const status=isComplete?'✦ 編制完成':`已安排 ${filled} / ${e.participants.length} 人`;
 return `<section class="party-summary" aria-label="隊伍配置總覽"><div class="party-summary-header"><div><h3>✦ 隊伍配置總覽</h3><p>僅計算主揪正式安排的位置；可打志願不會占用坦、補、輸出名額。</p></div><span class="party-summary-kpi">${status}</span></div><div class="party-progress-grid">${counters}</div>${groupRows}${unassigned.length?`<div class="party-unassigned"><strong>⌛ 等待主揪排位 ${unassigned.length} 人</strong><div>${unassigned.map(p=>escapeHtml(p.name)).join('、')}</div></div>`:''}${plan?'':`<p class="party-no-template">目前尚無 ${e.cap?e.cap+' 人':'不限人數'}的固定副本編制；僅顯示已安排人數，不預設各位置需求。</p>`}</section>`;
}
function memberRoster(e){return `<div class="roster-grid">${e.participants.map(p=>{let pref=e.roleEnabled?`<div class="roster-pref">可打：${formatPrefs(p)}</div>`:p.role?`<div class="roster-pref">${escapeHtml(p.role)}</div>`:'';let a=p.assignment;return `<div class="roster-person ${p.id==='me'?'me':''}"><div class="roster-name">${p.id==='me'?'✧ ':''}${escapeHtml(p.name)}${e.hostId===p.id?' · 主揪':''}</div>${pref}${e.roleEnabled?`<div class="roster-assign">${a?.role&&ROLE_TYPES[a.role]?`★ 主揪安排：${ROLE_TYPES[a.role].name}${a.job?'／'+escapeHtml(a.job):''}`:'☆ 正式位置尚未安排'}</div>`:''}</div>`}).join('')||'<p class="small muted">等你成為第一位冒險者</p>'}</div>`}
function savePreferences(id){let e=state.events.find(x=>x.id===id);if(!e||!registered(e)||!e.roleEnabled)return;let prefs=getPreferences();if(!prefs)return;let p=e.participants.find(p=>p.id==='me')||e.waitlist.find(p=>p.id==='me');if(!p)return;p.rolePreferences=prefs;
  if(p.assignment&&!Object.prototype.hasOwnProperty.call(prefs,p.assignment.role))p.assignment=null;
  else if(p.assignment&&p.assignment.job&&!roleJobs(prefs[p.assignment.role]).includes(p.assignment.job))p.assignment={role:p.assignment.role,job:''};
  save();editingPreferences=false;toast('你的可打位置與職業已更新 ✦');render();}
function saveAssignment(eventId,playerId){let e=state.events.find(x=>x.id===eventId);if(!e||e.hostId!=='me'||!e.roleEnabled)return;let p=e.participants.find(x=>x.id===playerId);if(!p)return;let role=document.querySelector(`[data-assignment-role="${CSS.escape(playerId)}"]`)?.value||'';let job=document.querySelector(`[data-assignment-job="${CSS.escape(playerId)}"]`)?.value||'';let prefs=cleanPrefs(p);if(role&&!Object.prototype.hasOwnProperty.call(prefs,role)){toast('只能安排玩家自己勾選的位置');return}if(role&&!job){toast('請替玩家選擇正式職業');return}if(role&&job&&!roleJobs(prefs[role]).includes(job)){toast('請選擇玩家填寫的職業');return}let plan=PARTY_TEMPLATES[Number(e.cap)];if(role&&plan&&e.participants.filter(x=>x.id!==playerId&&x.assignment?.role===role).length>=plan[role]){toast(`${ROLE_TYPES[role].name}已排滿 ${plan[role]} 人，請改選其他位置或先調整名單`);return}p.assignment=role?{role,job}:null;save();toast('主揪排位已儲存 ✦');render();}
function detail(e){const n=e.participants.length,full=isFull(e),j=joined(e),w=waited(e),my=e.hostId==='me',waiting=e.waitlist.length;let mine=e.participants.find(p=>p.id==='me')||e.waitlist.find(p=>p.id==='me');return `<div class="detail-backdrop" data-backdrop="1"><div class="detail-modal" role="dialog" aria-modal="true" aria-label="${escapeHtml(e.title)}"><div class="detail-header">${typePill(e)}<button class="close" data-close="1" aria-label="關閉">×</button></div><h2 class="detail-title">${escapeHtml(e.title)}</h2><div class="detail-cover"><div><div class="eyebrow">ADVENTURE INVITATION</div><strong>與夥伴們一起出發</strong></div><span class="star">✧</span></div><div class="detail-info"><div class="detail-line"><span>◷</span><span>${dateFmt(e.date)}　${escapeHtml(e.time)}${e.end?'–'+escapeHtml(e.end):''}（台灣時間）</span></div><div class="detail-line"><span>♙</span><span>主揪：${escapeHtml(e.host)}</span></div><div class="detail-line"><span>⌖</span><span>${escapeHtml(e.location||'主揪尚未公布集合地點')}</span></div></div><p class="small" style="line-height:1.8;color:#d6dfef;white-space:pre-wrap">${escapeHtml(e.description||'主揪尚未填寫活動說明。')}</p><div class="divider"></div><div class="row between"><strong>參加名單</strong><span class="small gold">${n} ${e.cap?'/ '+e.cap+' 人':'人 · 不限名額'}</span></div>${e.cap?`<div class="progress" style="margin-top:10px"><div style="width:${Math.min(100,n/e.cap*100)}%"></div></div>`:''}${memberRoster(e)}${partySummary(e)}${waiting?`<p class="small muted">候補 ${waiting} 人：${e.waitlist.map(p=>escapeHtml(p.name)).join('、')}</p>`:''}
${e.roleEnabled&&registered(e)&&!editingPreferences?`<div class="notice" style="margin-top:14px"><strong>✧ 我的可打位置</strong><div style="margin-top:5px">${formatPrefs(mine)}</div><button class="btn soft small" style="margin-top:9px" data-pref-edit="${e.id}">✎ 修改位置與職業</button></div>`:''}
${e.roleEnabled&&e.status==='active'&&(!registered(e)||editingPreferences)?preferenceFields(registered(e)?mine:null):''}
${e.status==='cancelled'?'<div class="notice" style="margin-top:16px">這場活動已取消，不能再報名。</div>':`<div class="row wrap" style="margin-top:17px">${editingPreferences&&registered(e)?`<button class="btn primary" data-pref-save="${e.id}" style="flex:1">儲存可打位置</button><button class="btn soft" data-pref-cancel="1">取消修改</button>`:j?`<button class="btn danger" data-leave="${e.id}" style="flex:1">✓ 已報名 · 取消 +1</button>`:w?`<button class="btn danger" data-leave="${e.id}" style="flex:1">候補中 · 取消候補</button>`:full&&!e.waitlistEnabled?`<button class="btn" disabled style="flex:1">名額已滿</button>`:`<button class="btn primary" data-join="${e.id}" style="flex:1">${full?'✦ 加入候補':'＋1 我要參加'}</button>`}${my?`<button class="btn soft" data-edit="${e.id}">編輯活動</button>`:''}</div>${full&&!registered(e)&&e.waitlistEnabled?'<p class="small muted">名額已滿，按下按鈕將加入候補名單。</p>':''}${my?`<button class="linkish" style="margin-top:18px;color:#f0a4aa" data-cancel="${e.id}">取消整場活動</button>`:''}`}
${hostAssignmentPanel(e)}<div class="divider"></div><button class="btn full soft" data-share="${e.id}">⤴ 複製活動資訊</button><p class="tiny muted" style="margin:11px 0 0">這是瀏覽器模擬報名與排位，並未同步給其他人或 Discord。</p></div></div>`}
function showDialog(){let e=state.events.find(x=>x.id===dialog);if(!e){dialog=null;document.getElementById('overlay').innerHTML='';return}document.getElementById('overlay').innerHTML=detail(e)}
function openDialog(id){dialog=id;editingPreferences=false;showDialog()}
function closeDialog(){dialog=null;editingPreferences=false;document.getElementById('overlay').innerHTML=''}
function route(p){page=p;closeDialog();if(p!=='create')editId=null;window.scrollTo(0,0);render()}
function join(id){let e=state.events.find(x=>x.id===id);if(!e||e.status!=='active'||registered(e))return;let prefs=e.roleEnabled?getPreferences():null;if(e.roleEnabled&&!prefs)return;let item={id:'me',name:user(),...(prefs?{rolePreferences:prefs}:{})};if(isFull(e)){if(!e.waitlistEnabled)return;e.waitlist.push(item);toast('已加入候補名單 ✦')}else{e.participants.push(item);toast('報名成功！等待主揪安排位置 ✦')}save();editingPreferences=false;render()}
function leave(id){let e=state.events.find(x=>x.id===id);if(!e)return;let was=joined(e);e.participants=e.participants.filter(p=>p.id!=='me');e.waitlist=e.waitlist.filter(p=>p.id!=='me');if(was&&e.waitlistEnabled&&e.waitlist.length&&(!e.cap||e.participants.length<e.cap)){let next=e.waitlist.shift();e.participants.push(next)}save();toast('已取消報名');render()}
function submitEvent(form){let data=new FormData(form);let title=(data.get('title')||'').trim(),date=data.get('date'),time=data.get('time'),end=data.get('end');if(!title||!date||!time){toast('請填寫活動名稱、日期與開始時間');return}if(end&&end<=time){toast('結束時間必須晚於開始時間');return}let cap=Number(data.get('cap')),participants=[{id:'me',name:user()}];if(editId){let old=state.events.find(e=>e.id===editId);if(!old)return;Object.assign(old,{title,date,time,end,location:(data.get('location')||'').trim(),description:(data.get('description')||'').trim(),category:data.get('category')||'other',cap,roleEnabled:data.has('roleEnabled'),waitlistEnabled:data.has('waitlistEnabled')});toast('活動已更新 ✦');dialog=old.id}else{let id='event-'+Date.now()+'-'+Math.round(Math.random()*1000);state.events.push({id,title,date,time,end,location:(data.get('location')||'').trim(),description:(data.get('description')||'').trim(),category:data.get('category')||'other',cap,roleEnabled:data.has('roleEnabled'),waitlistEnabled:data.has('waitlistEnabled'),host:user(),hostId:'me',participants,waitlist:[],status:'active'});dialog=id;toast('冒險建立成功 ✦')}save();editId=null;page='calendar';picked=dateOf(date)?date:iso(new Date());let d=dateOf(date);year=d.getFullYear();month=d.getMonth();render()}
function saveProfile(form){let name=(new FormData(form).get('name')||'').trim();if(!name)return;state.profile.name=name;state.profile.avatar=chosenAvatar;state.events.forEach(e=>{if(e.hostId==='me')e.host=name;e.participants.forEach(p=>{if(p.id==='me')p.name=name});e.waitlist.forEach(p=>{if(p.id==='me')p.name=name})});save();toast('個人資料已儲存 ✦');render()}
function cancelEvent(id){let e=state.events.find(x=>x.id===id);if(!e||e.hostId!=='me')return;if(confirm('確定取消這場活動嗎？活動將保留並標記已取消。')){e.status='cancelled';save();toast('活動已標記為取消');render()}}
function shareEvent(id){let e=state.events.find(x=>x.id===id);if(!e)return;let t=`✦ ${e.title}\n${dateFmt(e.date)} ${e.time}${e.end?'-'+e.end:''}\n主揪：${e.host}\n地點：${e.location||'待公告'}\n參加：${e.participants.length}${e.cap?'/'+e.cap:''} 人\n${e.description}`;if(navigator.clipboard?.writeText){navigator.clipboard.writeText(t).then(()=>toast('活動資訊已複製 ✦')).catch(()=>toast('目前瀏覽器無法複製'))}else toast('目前瀏覽器無法複製')}
document.addEventListener('click',ev=>{let el=ev.target.closest('[data-nav],[data-detail],[data-close],[data-backdrop],[data-pick],[data-month],[data-calmode],[data-category],[data-mytab],[data-join],[data-leave],[data-edit],[data-cancel],[data-share],[data-avatar],[data-action],[data-pref-edit],[data-pref-save],[data-pref-cancel],[data-assign]');if(!el)return;
if(el.hasAttribute('data-backdrop')&&ev.target===el){closeDialog();return}if(el.dataset.close){closeDialog();return}
if(el.dataset.nav){route(el.dataset.nav);return}if(el.dataset.detail){openDialog(el.dataset.detail);return}if(el.dataset.pick){picked=el.dataset.pick;render();return}
if(el.dataset.month){if(el.dataset.month==='today'){let t=new Date();month=t.getMonth();year=t.getFullYear();picked=iso(t)}else{let d=new Date(year,month+(el.dataset.month==='prev'?-1:1),1);month=d.getMonth();year=d.getFullYear();picked=iso(new Date(year,month,1))}render();return}
if(el.dataset.calmode){calMode=el.dataset.calmode;render();return}if(el.dataset.category){category=el.dataset.category;render();return}if(el.dataset.mytab){myTab=el.dataset.mytab;render();return}
if(el.dataset.join){join(el.dataset.join);return}if(el.dataset.leave){leave(el.dataset.leave);return}
if(el.dataset.prefEdit){editingPreferences=true;showDialog();return}if(el.dataset.prefSave){savePreferences(el.dataset.prefSave);return}if(el.dataset.prefCancel){editingPreferences=false;showDialog();return}if(el.dataset.assign){saveAssignment(el.dataset.assign,el.dataset.player);return}
if(el.dataset.edit){editId=el.dataset.edit;route('create');return}if(el.dataset.cancel){cancelEvent(el.dataset.cancel);return}if(el.dataset.share){shareEvent(el.dataset.share);return}
if(el.dataset.avatar){chosenAvatar=el.dataset.avatar;document.querySelectorAll('[data-avatar]').forEach(b=>b.classList.toggle('picked',b.dataset.avatar===chosenAvatar));const picture=document.querySelector('.profile-head .avatar');if(picture)picture.textContent=chosenAvatar;return}
if(el.dataset.action==='reset'){if(confirm('將重設所有示範活動與個人資料，確定嗎？')){state=seed();chosenAvatar=state.profile.avatar;save();route('home');toast('示範資料已重設')}}});
document.addEventListener('change',ev=>{
 const t=ev.target;
 if(t?.dataset?.roleCheck){let k=t.dataset.roleCheck;let panel=document.querySelector(`[data-role-panel="${k}"]`);if(panel)panel.hidden=!t.checked;let card=t.closest('.role-card');if(card)card.classList.toggle('selected',t.checked);}
 if(t?.dataset?.assignmentRole){let id=t.dataset.assignmentRole,e=state.events.find(x=>x.id===dialog),p=e?.participants.find(x=>x.id===id),sel=document.querySelector(`[data-assignment-job="${CSS.escape(id)}"]`);if(sel&&p){sel.innerHTML=t.value?assignmentJobs(p,t.value):'<option value="">請先選位置</option>';sel.disabled=!t.value}}
});
document.addEventListener('submit',ev=>{if(ev.target.id==='eventForm'){ev.preventDefault();submitEvent(ev.target)}else if(ev.target.id==='profileForm'){ev.preventDefault();saveProfile(ev.target)}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&dialog)closeDialog()});
render();
})();
</script>
</body>
